# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - creatives-generation-ui

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://creativesgenregistry.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_fe4e86ab6b8e4d44be83cbec7bed8260 }}
        password: ${{ secrets.AzureAppService_ContainerPassword_2b56e0e53d484187ba87f9c63b073785 }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: creativesgenregistry.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_fe4e86ab6b8e4d44be83cbec7bed8260 }}/creatives-generation-ui:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'creatives-generation-ui'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_9c334568d4884996a12c94877056f1cc }}
        images: 'creativesgenregistry.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_fe4e86ab6b8e4d44be83cbec7bed8260 }}/creatives-generation-ui:${{ github.sha }}'